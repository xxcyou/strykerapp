# ============================================================================
# build-localized.yml — 一键编译「汉化版」StrykerOSS（JDK 17 + 签名）
#
# 功能:
#   1. 生成简体中文资源 (scripts/localize_zh.py + scripts/zh_dict.py)
#   2. JDK 17 + Gradle 编译 release APK（R8 压缩/混淆，ndk-build 原生库）
#   3. 自动签名：配置了签名 Secrets 用固定密钥，否则用 JDK17 keytool 生成临时密钥
#   4. 上传 APK 为 Artifact；打 tag 时自动发布到 GitHub Release
#
# 触发方式:
#   * 手动: Actions -> "Build localized StrykerOSS" -> Run workflow
#   * 推送 tag (v*): 自动构建并发布 Release
#
# 可选 Secrets（Settings -> Secrets and variables -> Actions）:
#   STRYKER_KEYSTORE_B64      base64 编码的 keystore 文件内容（gen_keystore.sh 生成）
#   STRYKER_KEYSTORE_PASSWORD keystore 密码
#   STRYKER_KEY_ALIAS         密钥别名
#   STRYKER_KEY_PASSWORD      密钥密码
#   未配置时自动生成临时密钥签名（APK 可安装，但无法覆盖升级，密钥每次构建不同）。
# ============================================================================
name: Build localized StrykerOSS (JDK 17)

on:
  workflow_dispatch:        # 手动触发
  push:
    tags: [ 'v*' ]          # 打 tag 自动构建并发布

permissions:
  contents: write           # 允许 gh release create 上传 APK

jobs:
  build:
    name: Build & sign localized APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install SDK platform, build-tools, NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Generate Simplified-Chinese resources (all modules)
        run: |
          python3 scripts/localize_zh.py \
            --src app/src/main/res/values --out app/src/main/res/values-zh-rCN --dict scripts/zh_dict.py --strict \
            --src terminal/src/main/res/values --out terminal/src/main/res/values-zh-rCN --dict scripts/zh_dict_terminal.py --strict \
            --src Xorg/src/main/res/values --out Xorg/src/main/res/values-zh-rCN --dict scripts/zh_dict_xorg.py --strict \
            --src NeoTermBridge/src/main/res/values --out NeoTermBridge/src/main/res/values-zh-rCN --dict scripts/zh_dict_neotermbridge.py --strict
          echo "--- generated files ---"
          find . -path "*/values-zh-rCN/*" -name "strings*.xml" | sort

      - name: Decode signing keystore (if secrets provided)
        id: signing
        env:
          KS_B64: ${{ secrets.STRYKER_KEYSTORE_B64 }}
        run: |
          if [ -n "${KS_B64}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/stryker-release.jks"
            chmod 600 "$RUNNER_TEMP/stryker-release.jks"
            echo "keystore_file=$RUNNER_TEMP/stryker-release.jks" >> "$GITHUB_OUTPUT"
            echo "keystore_decoded=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded: $(ls -la "$RUNNER_TEMP/stryker-release.jks" | awk '{print $5}') bytes"
          else
            echo "keystore_decoded=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STRYKER_KEYSTORE_B64 not set — generating a TEMPORARY keystore with JDK17 keytool"
          fi

      - name: Generate temporary signing keystore (JDK 17 keytool)
        id: tempkeystore
        if: steps.signing.outputs.keystore_decoded != 'true'
        run: |
          PASS="$(openssl rand -hex 12)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/stryker-release.jks" \
            -alias stryker-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=StrykerOSS Localized Build, OU=CI, O=StrykerOSS, C=CN"
          echo "keystore_file=$RUNNER_TEMP/stryker-release.jks" >> "$GITHUB_OUTPUT"
          echo "storepass=$PASS" >> "$GITHUB_OUTPUT"
          echo "keyalias=stryker-release" >> "$GITHUB_OUTPUT"
          echo "keypass=$PASS" >> "$GITHUB_OUTPUT"
          echo "::warning::签名密钥为本次构建临时生成，无法用于覆盖安装升级。如需固定签名，请配置 STRYKER_KEYSTORE_B64 等 Secrets（见 README-zh-build.md）。"

      - name: Export signing properties
        run: |
          {
            echo "STRYKER_RELEASE_STORE_FILE=${{ steps.tempkeystore.outputs.keystore_file || steps.signing.outputs.keystore_file }}"
            echo "STRYKER_RELEASE_STORE_PASSWORD=${{ steps.tempkeystore.outputs.storepass || secrets.STRYKER_KEYSTORE_PASSWORD }}"
            echo "STRYKER_RELEASE_KEY_ALIAS=${{ steps.tempkeystore.outputs.keyalias || secrets.STRYKER_KEY_ALIAS }}"
            echo "STRYKER_RELEASE_KEY_PASSWORD=${{ steps.tempkeystore.outputs.keypass || secrets.STRYKER_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK with Gradle (JDK 17)
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect and rename APK
        id: apk
        run: |
          echo "--- apk outputs ---"
          find app/build/outputs -name "*.apk" -exec ls -la {} \;
          SRC=$(find app/build/outputs -name "*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$SRC" ]; then
            SRC=$(find app/build/outputs -name "*.apk" | head -1)
          fi
          if [ -z "$SRC" ]; then
            echo "::error::No APK found under app/build/outputs"
            exit 1
          fi
          SUFFIX=signed
          VERSION=$(grep -oP "versionName\s+\"\K[^\"]+" app/build.gradle || echo "6.0")
          OUT="StrykerOSS-${VERSION}-zh-rCN-${SUFFIX}.apk"
          cp "$SRC" "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "APK: $OUT ($(du -h "$OUT" | cut -f1))"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Verify APK signature
        run: |
          APKSIGNER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.apk_path }}"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrykerOSS-zh-rCN-apk
          path: |
            StrykerOSS-*-zh-rCN-*.apk
            StrykerOSS-*-zh-rCN-*.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.apk.outputs.apk_path }}" \
            "${{ steps.apk.outputs.apk_path }}.sha256" \
            --title "StrykerOSS 汉化版 ${{ github.ref_name }}" \
            --notes "自动化编译的简体中文汉化版 APK（JDK 17 + R8 + 签名）。仅限授权测试。"
